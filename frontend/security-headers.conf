# En-têtes de sécurité du frontend (inclus dans chaque bloc location qui sert des fichiers statiques).

# Interdit l'affichage de l'application dans une iframe d'un autre site (clickjacking).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content-Security-Policy : seuls les scripts de l'application s'exécutent (aucun script inline ni tiers),
# ce qui limite fortement l'impact d'une éventuelle injection (XSS) et donc le vol du JWT.
# - style 'unsafe-inline' : requis par Angular Material (styles de composants injectés dynamiquement) ;
# - blob: : prévisualisation des pièces jointes (images, PDF) ;
# - fonts.googleapis.com / fonts.gstatic.com : polices Inter et Material Icons.
# Si le backend est servi depuis un autre domaine, ajouter son origine (https:// et wss://) à connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# HSTS (Strict-Transport-Security) est envoyé par le proxy TLS : voir deploy/Caddyfile et docker-compose.https.yml.
