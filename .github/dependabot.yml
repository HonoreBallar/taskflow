# Mises à jour automatiques des dépendances : une PR groupée par écosystème chaque lundi.
# Les correctifs de sécurité arrivent sans attendre, dès qu'une alerte est publiée.
version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      backend:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Spring Boot 4 (et springdoc 3 qui va avec) est une migration à part entière, pas une PR automatique
      - dependency-name: 'org.springframework.boot:*'
        update-types: [version-update:semver-major]
      - dependency-name: 'org.springdoc:*'
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@ngrx/*', 'angular-eslint', 'typescript']
        update-types: [minor, patch]
      frontend:
        patterns: ['*']
        exclude-patterns: ['@angular/*', '@angular-devkit/*', '@ngrx/*', 'angular-eslint', 'typescript']
        update-types: [minor, patch]
    ignore:
      # Une version majeure d'Angular se fait avec `ng update` (migrations de code), pas par simple PR.
      # ESLint et TypeScript suivent la version d'Angular (angular-eslint 20 exige ESLint 9).
      - dependency-name: '@angular/*'
        update-types: [version-update:semver-major]
      - dependency-name: '@angular-devkit/*'
        update-types: [version-update:semver-major]
      - dependency-name: '@ngrx/*'
        update-types: [version-update:semver-major]
      - dependency-name: 'angular-eslint'
        update-types: [version-update:semver-major]
      - dependency-name: 'eslint'
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      - dependency-name: 'typescript'
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Java 17 et Node 22 sont les versions du projet (pom.xml, CI) : en changer se décide, ça ne se fusionne pas
      - dependency-name: 'maven'
        update-types: [version-update:semver-major]
      - dependency-name: 'eclipse-temurin'
        update-types: [version-update:semver-major]
      - dependency-name: 'node'
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Changer de version majeure de PostgreSQL exige de migrer les données (pg_upgrade ou dump/restore)
      - dependency-name: 'postgres'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
