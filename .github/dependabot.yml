# Mises à jour automatiques des dépendances : une PR groupée par écosystème chaque lundi.
# Les correctifs de sécurité arrivent sans attendre, dès qu'une alerte est publiée.
version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      backend:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@ngrx/*', 'angular-eslint', 'typescript']
        update-types: [minor, patch]
      frontend:
        patterns: ['*']
        exclude-patterns: ['@angular/*', '@angular-devkit/*', '@ngrx/*', 'angular-eslint', 'typescript']
        update-types: [minor, patch]
    ignore:
      # Une version majeure d'Angular se fait avec `ng update` (migrations de code), pas par simple PR.
      # ESLint et TypeScript suivent la version d'Angular (angular-eslint 20 exige ESLint 9).
      - dependency-name: '@angular/*'
        update-types: [version-update:semver-major]
      - dependency-name: '@angular-devkit/*'
        update-types: [version-update:semver-major]
      - dependency-name: '@ngrx/*'
        update-types: [version-update:semver-major]
      - dependency-name: 'angular-eslint'
        update-types: [version-update:semver-major]
      - dependency-name: 'eslint'
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      - dependency-name: 'typescript'
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
