name: CI

# Build, tests, qualité du code et tests de bout en bout.
# Seul le job « CI OK » est à exiger dans la protection de branche : il résume tous les autres.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Fichiers modifiés
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            stack:
              - 'backend/**'
              - 'frontend/**'
              - 'deploy/**'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  backend:
    name: Backend (tests, couverture, qualité)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # verify = compilation + tests (H2) + seuil de couverture JaCoCo + formatage Spotless + SpotBugs/FindSecBugs
      - name: mvn verify
        run: mvn -B --no-transfer-progress verify
      - name: Publier les rapports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-rapports
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            backend/target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 14

  backend-postgres:
    name: Backend (tests sur PostgreSQL)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskflow_test
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Remplace la base H2 des tests par la même version de PostgreSQL qu'en production
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/taskflow_test
      SPRING_DATASOURCE_USERNAME: taskflow
      SPRING_DATASOURCE_PASSWORD: taskflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: mvn test
        run: mvn -B --no-transfer-progress test

  frontend:
    name: Frontend (lint, build, tests, couverture)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CYPRESS_INSTALL_BINARY: 0 # Cypress ne sert qu'au job E2E
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Formatage (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Build de production
        run: npm run build
      - name: Tests unitaires et seuil de couverture
        run: npm run test:coverage
      - name: Vulnérabilités des dépendances (npm audit)
        run: npm audit --audit-level=high
      - name: Publier le rapport de couverture
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-couverture
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Images Docker, scan et tests E2E
    needs: changes
    if: needs.changes.outputs.stack == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint du Dockerfile backend (Hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: backend/Dockerfile
      - name: Lint du Dockerfile frontend (Hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: frontend/Dockerfile

      - name: Démarrer l'application
        uses: ./.github/actions/start-stack

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache du binaire Cypress
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npx cypress install
      - name: Tests de bout en bout (Cypress)
        working-directory: frontend
        env:
          CYPRESS_BASE_URL: http://localhost
        run: npm run e2e
      - name: Publier les captures d'écran des échecs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cypress-captures
          path: frontend/cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Logs de l'application
        if: failure()
        run: docker compose logs --no-color --tail 300

      # Vulnérabilités corrigibles (HIGH/CRITICAL) dans les images : paquets système et bibliothèques embarquées
      - name: Scan de l'image backend (Trivy)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: taskflow-backend
          trivyignores: .trivyignore.yaml
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Scan de l'image frontend (Trivy)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: taskflow-frontend
          trivyignores: .trivyignore.yaml
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  ci-ok:
    name: CI OK
    needs: [changes, backend, backend-postgres, frontend, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le résultat de tous les jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : $RESULTS"
          # Un job ignoré (rien n'a changé dans sa partie du dépôt) compte comme réussi
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::Au moins un job a échoué ou a été annulé"
              exit 1
            fi
          done
